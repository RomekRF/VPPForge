name: build-windows
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  win64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: Embed the app
        run: python3 tools/embed.py app/vpp-forge.html src/app_html.h
      - name: Compile resources
        run: x86_64-w64-mingw32-windres resources/vppforge.rc -O coff -o vppforge_res.o
      - name: Compile vppforge.exe
        run: >
          x86_64-w64-mingw32-gcc -O2 -municode -mwindows
          src/vppforge.c vppforge_res.o -o vppforge.exe
          -lws2_32 -lcomdlg32 -ladvapi32 -lshell32 -luser32 -static -s
      - name: Package
        run: |
          mkdir -p dist/VPPForge
          cp vppforge.exe dist/VPPForge/
          cp "installer/Install VPP Forge.bat" "installer/Uninstall VPP Forge.bat" installer/README.txt dist/VPPForge/
          cd dist && zip -r VPPForge-Desktop-Win64.zip VPPForge
      - uses: actions/upload-artifact@v4
        with:
          name: VPPForge-Desktop-Win64
          path: dist/VPPForge-Desktop-Win64.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/VPPForge-Desktop-Win64.zip
