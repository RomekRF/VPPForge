name: build-windows
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  win64:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install cross toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 zip
      - name: Check the What's new notes
        run: python3 tools/check_changelog.py
      - name: Pack the game tables
        run: python3 tools/pack_tables.py
      - name: Embed the app
        run: python3 tools/embed.py app/vpp-forge.html src/app_html.h
      - name: Compile resources
        run: x86_64-w64-mingw32-windres resources/vppforge.rc -O coff -o vppforge_res.o
      - name: Compile vppforge.exe
        run: >
          x86_64-w64-mingw32-gcc -O2 -municode -mwindows
          src/vppforge.c vppforge_res.o -o vppforge.exe
          -lws2_32 -lcomdlg32 -ladvapi32 -lshell32 -luser32 -lole32 -luuid -lwininet -static -s
      - name: Package
        run: |
          mkdir -p dist/VPPForge
          cp vppforge.exe dist/VPPForge/
          cp installer/README.txt dist/VPPForge/
          cp app/vpp-forge.html dist/VPPForge/VPPForge-Browser.html
          cd dist && zip -r VPPForge-Desktop-Win64.zip VPPForge
          cd .. && cp app/vpp-forge.html dist/VPPForge-Browser.html
      - uses: actions/upload-artifact@v7
        with:
          name: VPPForge-Desktop-Win64
          path: dist/VPPForge-Desktop-Win64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: VPPForge-Browser
          path: dist/VPPForge-Browser.html
      # The release page, from this version's What's new entry and the
      # files' SHA-256; every build writes it (and shows it in the run's
      # summary), a tag also checks it matches version.h.
      - name: Write the release notes
        id: notes
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 tools/release_notes.py dist/release-notes.md $TAG
          cat dist/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: dist/release-notes.md
          files: |
            dist/VPPForge-Desktop-Win64.zip
            dist/VPPForge-Browser.html
            vppforge.exe
