<style>
:root{
  /* Classic theme · echoes the original Descent Manager tools:
     light gray chrome, white lists, blue selection */
  --bg:#ffffff; --surface:#f0efec; --surface-2:#e7e5e0; --raised:#ffffff;
  --border:#dbd8d2; --border-2:#c9c5bd; --border-3:#aeaaa0;
  --accent:#1a66c4; --accent-hover:#2f7ce0; --accent-down:#1254a8;
  --accent-soft:rgba(26,102,196,.09); --accent-soft-2:rgba(26,102,196,.16);
  --text:#1a1918; --text-2:#454039; --text-3:#736d62;
  --warn:#9a6b1f; --err:#b1402a; --ok:#4e7a3a;
  --c-text:#8a5a00; --c-level:#b5451a; --c-image:#2f6fa8; --c-anim:#7a5aa8;
  --c-audio:#5d7a3f; --c-model:#2e8a72; --c-bin:#8e887d;
  --card:#ffffff; --card-panel:#ffffff;
  --grid-line:rgba(0,0,0,.035);
  --sans:"Segoe UI","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:6px; --r-s:4px;
  --shadow:0 8px 24px rgba(30,28,24,.18), 0 2px 8px rgba(30,28,24,.12);
}
body.theme-dark{
  --bg:#131211; --surface:#191817; --surface-2:#1f1e1c; --raised:#262421;
  --border:#292724; --border-2:#37342e; --border-3:#454138;
  --accent:#d0521c; --accent-hover:#e2662e; --accent-down:#b8460f;
  --accent-soft:rgba(208,82,28,.09); --accent-soft-2:rgba(208,82,28,.16);
  --text:#ece7df; --text-2:#a69e92; --text-3:#6f695f;
  --warn:#d9a45b; --err:#e0654a; --ok:#93ae7d;
  --c-text:#c9a35a; --c-level:#d0521c; --c-image:#7c9fb6; --c-anim:#a58cc8;
  --c-audio:#8ba86e; --c-model:#6ec2a8; --c-bin:#6e675c;
  --card:#1f1e1c; --card-panel:#191817;
  --grid-line:var(--grid-line);
  --shadow:0 8px 28px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:13px; line-height:1.45;
  display:flex; flex-direction:column; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft-2)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px; border-radius:2px}
svg.i{width:14px;height:14px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}

.btn{
  display:inline-flex; align-items:center; gap:6px;
  height:23px; padding:0 9px; border-radius:var(--r-s);
  background:transparent; border:1px solid transparent;
  color:var(--text-2); font:500 12px var(--sans); cursor:pointer;
  transition:background .1s,color .1s,border-color .1s;
  white-space:nowrap; user-select:none;
}
.btn:hover{background:var(--raised); color:var(--text)}
.btn:active{background:var(--surface-2)}
.btn.outline{border-color:var(--border-2); color:var(--text)}
.btn.outline:hover{border-color:var(--border-3); background:var(--raised)}
.btn.primary{background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600}
.btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
.btn.primary:active{background:var(--accent-down)}
.btn.icon{width:24px; padding:0; justify-content:center}
.btn.sm{height:22px; padding:0 8px; font-size:11.5px}
.btn.icon.sm{width:22px; padding:0}
.btn:disabled{opacity:.38; cursor:default; pointer-events:none}
.btn .k{font:400 10px var(--mono); color:inherit; opacity:.55; margin-left:2px}

/* ============ title bar ============ */
#titlebar{
  flex:none; height:33px; display:flex;
  align-items:center; justify-content:space-between; gap:10px;
  padding:0 10px; background:var(--surface);
  border-bottom:1px solid var(--border);
}
.tb-left{display:flex; align-items:center; gap:10px; min-width:0; flex:1 1 auto}
#menubar{display:flex; gap:1px}
#menubar button{
  height:22px; padding:0 8px; border:none; background:none; border-radius:4px;
  color:var(--text-2); font:400 12px var(--sans); cursor:default; user-select:none;
}
#menubar button:hover,#menubar button.open{background:var(--raised); color:var(--text)}
#menubar button.has-update::after{
  content:""; width:5px; height:5px; border-radius:50%; background:var(--accent);
  display:inline-block; vertical-align:top; margin-left:3px;
}
.brand{display:flex; align-items:center; gap:9px; user-select:none}

.brand .name{font:600 12px var(--mono); letter-spacing:.14em; color:var(--text)}
.brand .name b{color:#d0521c;font-weight:600}
#docChip{
  display:flex; align-items:center; gap:7px; min-width:0;
  font:400 12px var(--sans); color:var(--text-2);
  margin-left:6px; overflow:hidden; white-space:nowrap;
}
#docChip .fname{color:var(--text); font-weight:600; cursor:text; border-bottom:1px dotted transparent; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:34ch}
#docChip .fname:hover{border-bottom-color:var(--text-3)}
#docChip input{height:20px;padding:0 5px;border-radius:3px;background:var(--bg);border:1px solid var(--accent);color:var(--text);font:600 12px var(--sans);width:24ch}
#docChip .dirty{width:7px;height:7px;border-radius:50%;background:var(--accent-hover);flex:none;display:none}
#docChip.is-dirty .dirty{display:block}
#docChip .empty{color:var(--text-3)}
.tb-actions{display:flex; gap:6px; justify-content:flex-end; align-items:center; flex:none}
.tb-sep{width:1px; height:18px; background:var(--border-2); margin:0 4px; flex:none}

/* ============ toolbar ============ */
#toolbar{
  flex:none; display:flex; flex-wrap:wrap; gap:3px; align-items:center;
  padding:3px 6px; background:var(--surface);
  border-bottom:1px solid var(--border);
}
#toolbar .grow{flex:1}
@media (max-width:700px){
  #toolbar .btn .k{display:none}
}
.btn.tool{border-color:transparent; color:var(--text-2)}
.btn.tool:hover{border-color:var(--border-2); color:var(--text)}
.btn.tool.primary{color:#fff; border-color:var(--accent)}
.btn.tool.primary:hover{border-color:var(--accent-hover)}
#toolbar .search{flex:0 1 240px; min-width:110px}
body.no-doc #toolbar{display:none}
@media (max-width:640px){
  #toolbar .search .k{display:none}
  .brand .name{display:none}
}

/* ============ workspace ============ */
#workspace{flex:1; display:flex; min-height:0}
body.flip #workspace{flex-direction:row-reverse}
body.flip #sidebar{border-right:none; border-left:1px solid var(--border)}
#sidebar{
  width:340px; min-width:260px; max-width:560px; flex:none;
  display:flex; flex-direction:column; min-height:0;
  background:var(--surface); border-right:1px solid var(--border);
}
#vdiv{flex:none; width:5px; margin:0 -2.5px; cursor:col-resize; z-index:5; position:relative}
#vdiv::after{content:""; position:absolute; inset:0 2px; background:transparent; transition:background .1s}
#vdiv:hover::after,#vdiv.drag::after{background:var(--accent)}
#hdiv{flex:none; height:5px; margin:-2.5px 0; cursor:row-resize; z-index:5; position:relative}
#hdiv::after{content:""; position:absolute; inset:2px 0; background:transparent; transition:background .1s}
#hdiv:hover::after,#hdiv.drag::after{background:var(--accent)}
#listCol{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--bg)}
@media (max-width:860px){
  #workspace{flex-direction:column}
  #sidebar{width:100%!important; max-width:none; max-height:52%; border-right:none; border-bottom:1px solid var(--border)}
  #vdiv{display:none}
}
#prevHead{
  display:flex; align-items:center; gap:8px; flex:none;
  padding:4px 8px 0; min-width:0;
}
#prevHead #prevActs{margin-left:auto; display:flex; gap:3px; flex:none}

/* ---- type tree ---- */
#typeTree{flex:none; max-height:38%; overflow-y:auto; padding:3px 4px; border-bottom:1px solid var(--border)}
.tnode{
  display:flex; align-items:center; gap:6px; height:20px; padding:0 6px;
  border-radius:var(--r-s); cursor:pointer; user-select:none;
  font:400 12px var(--sans); color:var(--text);
}
.tnode:hover{background:var(--surface-2); color:var(--text)}
.tnode.on{background:var(--accent-soft); color:var(--text)}
.tnode .lbl{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tnode .cnt{font:400 11px var(--mono); color:var(--text-3)}
.tnode .tact{
  display:none; width:18px; height:18px; flex:none; border:none; border-radius:3px;
  background:none; color:var(--text-3); cursor:pointer; padding:0;
  align-items:center; justify-content:center; opacity:.75;
}
.tnode .tact.tsel{display:inline-flex}
.tnode:hover .tact{display:inline-flex}
.tnode .tact:hover{background:var(--surface-2); color:var(--text); opacity:1}
.tnode.on .tact{color:inherit}
body:not(.theme-dark) .tnode.on .tact:hover{background:rgba(255,255,255,.22); color:#fff}
.tnode .tact svg{width:12px;height:12px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
#marquee{position:fixed; z-index:80; border:1px solid var(--accent); background:var(--accent-soft); pointer-events:none; display:none}
/* browsing a linked VPP: read-only, visually set apart from your own files */
body.browsing-ref #rows .row .fn{color:var(--text-2)}
body.browsing-ref #colHead{background:var(--accent-soft); color:var(--text-2)}
body.browsing-ref #colHead::after{content:"linked · read-only"; position:absolute; right:10px; font:400 10px var(--mono); color:var(--text-3)}
body.browsing-ref #colHead{position:relative}
.conn3d{display:flex; flex-wrap:wrap; gap:3px; align-items:center; margin:2px 0 6px; flex:none}
.chip3d{
  height:18px; padding:0 7px; font:400 10.5px var(--mono); cursor:pointer;
  border:1px solid var(--border-2); border-radius:9px; background:var(--surface); color:var(--c-model);
  max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.chip3d:hover{border-color:var(--border-3); background:var(--raised)}
.chip3d.miss{color:var(--warn); cursor:default; opacity:.8}
.chip3d.miss:hover{border-color:var(--border-2); background:var(--surface)}
.tnode.on .cnt{color:var(--text-2)}

/* ---- preview panel ---- */
#prevPane{flex:1; display:flex; flex-direction:column; min-height:0}
#prevName{flex:1; min-width:0; font:600 12px var(--sans); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#prevMeta{flex:none; padding:1px 8px 6px; font:400 11px var(--sans); color:var(--text-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#prevBody{flex:1; overflow:auto; min-height:0; padding:0 8px 8px; position:relative}
#prevBody.center{display:flex; align-items:center; justify-content:center}
.placeholder{display:flex; flex-direction:column; align-items:center; gap:7px; color:var(--text-3); text-align:center; font-size:12px; padding:12px}
.placeholder svg{width:22px;height:22px;stroke:var(--text-3);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.placeholder .t{color:var(--text-2); font-weight:500}

.viewer-bar{display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap; min-height:22px}
.vinfo{font:400 11px var(--sans); color:var(--text-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.vinfo b{color:var(--text); font-weight:600}
.vinfo .warn{color:var(--warn)}
.seg{display:inline-flex; border:1px solid var(--border-2); border-radius:var(--r-s); overflow:hidden; background:var(--surface); flex:none}
.seg button{
  height:20px; padding:0 8px; border:none; background:none; cursor:pointer;
  font:500 11px var(--sans); color:var(--text-2); border-left:1px solid var(--border-2);
}
.seg button:first-child{border-left:none}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent-soft-2); color:var(--accent-hover)}

.card{background:var(--card); border:1px solid var(--border); border-radius:var(--r); overflow:hidden}
#prevBody .card{background:var(--card-panel)}
.codeblock{font:400 11.5px/1.65 var(--mono); color:var(--text); padding:10px 0; overflow-x:auto}
.codeblock .l{white-space:pre; padding-right:14px; display:block}
.codeblock .l:hover{background:var(--surface-2)}
.codeblock .ln{display:inline-block; min-width:4ch; padding:0 10px 0 8px; text-align:right; color:var(--text-3); user-select:none; font-size:10px}
.codeblock .cm{color:var(--text-3)} .codeblock .kw{color:var(--warn)} .codeblock .st{color:var(--c-image)}
.hex{font:400 11px/1.7 var(--mono); color:var(--text-2); padding:10px 12px; overflow-x:auto}
.hex .off{color:var(--text-3)} .hex .asc{color:var(--c-image)}

.checker{
  display:inline-block; line-height:0; border:1px solid var(--border-2); border-radius:var(--r-s);
  background:
    linear-gradient(45deg,var(--surface-2) 25%,transparent 25%,transparent 75%,var(--surface-2) 75%),
    linear-gradient(45deg,var(--surface-2) 25%,transparent 25%,transparent 75%,var(--surface-2) 75%);
  background-size:16px 16px; background-position:0 0,8px 8px; background-color:var(--surface);
  max-width:100%; max-height:100%; overflow:auto;
}
.checker canvas{display:block}
canvas.px{image-rendering:pixelated}

.audio-card{display:flex; flex-direction:column; gap:12px; padding:14px; width:100%}
.audio-card .hd{display:flex; align-items:center; gap:11px}
.audio-card .ic{width:34px;height:34px;border-radius:8px;background:var(--accent-soft-2);display:grid;place-items:center;flex:none}
.audio-card .ic svg{width:16px;height:16px;stroke:var(--accent-hover);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.audio-card .ttl{font:600 12px var(--sans); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.audio-card .st{font:400 10.5px var(--mono); color:var(--text-3)}
.audio-card audio{width:100%; height:36px}

.kv{width:100%}
.kv h3{font:600 10px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); padding:9px 13px; border-bottom:1px solid var(--border)}
.kv .r{display:flex; justify-content:space-between; gap:16px; padding:5px 11px; border-bottom:1px solid var(--border); font:400 12px var(--sans)}
.kv .r:last-child{border-bottom:none}
.kv .r span:first-child{color:var(--text-2); flex:none}
.kv .r span:last-child{color:var(--text); text-align:right; overflow:hidden; text-overflow:ellipsis}

.view3d{position:relative; width:100%; height:100%; min-height:200px; border:1px solid var(--border-2); border-radius:var(--r-s); overflow:hidden; background:#0d0c0b}
.view3d canvas{display:block; width:100%; height:100%; touch-action:none; cursor:grab}
.view3d canvas:active{cursor:grabbing}
.v3wrap{display:flex; flex-direction:column; gap:0; height:100%}
.v3wrap .viewer-bar{flex:none}
.v3wrap .view3d{flex:1; min-height:160px}
.hint3d{position:absolute; left:8px; bottom:6px; font:400 10px var(--mono); color:var(--text-3); pointer-events:none}

/* ============ list column ============ */
.search{
  flex:1; min-width:0; display:flex; align-items:center; gap:7px;
  height:23px; padding:0 8px; border-radius:var(--r-s);
  background:var(--surface); border:1px solid var(--border-2);
  transition:border-color .1s;
}
.search:focus-within{border-color:var(--accent)}
.search svg.i{width:13px;height:13px;color:var(--text-3)}
.search input{flex:1; min-width:0; background:none; border:none; color:var(--text); font:400 12px var(--sans)}
.search input::placeholder{color:var(--text-3)}
.search .k{font:400 10px var(--mono); color:var(--text-3); border:1px solid var(--border-2); border-radius:3px; padding:0 4px}

#colHead{
  flex:none; display:grid;
  grid-template-columns:minmax(0,1.4fr) 88px minmax(0,1fr) 70px;
  gap:0 8px; padding:0 16px 0 8px; height:20px; align-items:center;
  border-bottom:1px solid var(--border); background:var(--surface);
  font:600 11px var(--sans); color:var(--text-2);
  user-select:none;
}
#colHead span{cursor:pointer; display:inline-flex; align-items:center; gap:4px; white-space:nowrap}
#colHead span:hover{color:var(--text-2)}
#colHead .sz{justify-self:end}
#colHead .arr{color:var(--accent-hover); font-size:9px}
#rows{flex:1; overflow-y:auto; min-height:0; overscroll-behavior:contain; position:relative}
.row{
  display:grid; grid-template-columns:minmax(0,1.4fr) 88px minmax(0,1fr) 70px;
  gap:0 8px; align-items:center; height:19px; padding:0 16px 0 8px;
  border-left:2px solid transparent; cursor:default; user-select:none;
  font:400 12px var(--sans); color:var(--text);
}
.row:hover{background:var(--surface)}
.row.sel{background:var(--accent-soft); border-left-color:var(--accent); color:var(--text)}
.row .nm{display:flex; align-items:center; gap:6px; min-width:0}
.ficon{width:14px;height:14px;flex:none;display:inline-flex}
.ficon svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.row .fn{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .fn .hit{color:var(--accent-hover)}
.row .tp{font-size:11.5px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .info{font-size:11.5px; color:var(--text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-variant-numeric:tabular-nums}
.row.sel .tp,.row.sel .info{color:var(--text-2)}
.row .sz{text-align:right; font-size:11.5px; color:var(--text-2); font-variant-numeric:tabular-nums}
.row.sel .sz{color:var(--text-2)}
body:not(.theme-dark) .row.sel{background:var(--accent); border-left-color:var(--accent-down); color:#fff}
body:not(.theme-dark) .row.sel .sz,
body:not(.theme-dark) .row.sel .tp,
body:not(.theme-dark) .row.sel .info{color:rgba(255,255,255,.82)}
body:not(.theme-dark) .row.sel .fn .hit{color:#fff; text-decoration:underline}
body:not(.theme-dark) .tnode.on{background:var(--accent); color:#fff}
body:not(.theme-dark) .tnode.on .cnt{color:rgba(255,255,255,.8)}
@media (max-width:1150px){
  #colHead,#rows .row{grid-template-columns:minmax(0,1.4fr) 88px 70px}
  #colHead .inf,.row .info{display:none}
}
#listFoot{
  flex:none; display:flex; align-items:center; gap:10px;
  height:20px; padding:0 8px; border-top:1px solid var(--border);
  font:400 11px var(--sans); color:var(--text-2); background:var(--surface);
}
#listFoot .grow{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#checksChip{
  display:none; align-items:center; gap:5px; cursor:pointer;
  color:var(--warn); font:500 11px var(--sans);
  padding:2px 8px; border-radius:10px; border:1px solid transparent;
}
#checksChip:hover{border-color:var(--border-2); background:var(--surface-2)}
#checksChip.err{color:var(--err)}
#checksChip svg.i{width:12px;height:12px}


/* ============ empty state ============ */
#emptyState{
  flex:1; display:none; flex-direction:column; align-items:center; justify-content:center;
  padding:28px; text-align:center; min-height:0; overflow:auto;
  background:
    repeating-linear-gradient(0deg, transparent 0 47px, var(--grid-line) 47px 48px),
    repeating-linear-gradient(90deg, transparent 0 47px, var(--grid-line) 47px 48px);
}
#emptyState h1{font:600 20px/1.3 var(--sans); color:var(--text); margin:16px 0 4px; letter-spacing:-.01em}
#emptyState h1 #esVer{font:400 12px var(--mono); color:var(--text-3)}
#emptyState .sub{font:400 12.5px var(--sans); color:var(--text-2); max-width:46ch}
#emptyState .sub .m{font-family:var(--mono); color:var(--warn); font-size:12px}
.es-mark{display:block; width:56px; height:56px; border-radius:12px; background-size:cover}
#esRecents{margin-top:26px; display:flex; flex-direction:column; gap:1px; width:min(360px,86%)}
#esRecents .es-h{font:600 10px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); margin-bottom:5px; text-align:left}
.es-r{
  display:flex; align-items:center; gap:8px; height:26px; padding:0 9px;
  border:none; background:none; border-radius:var(--r-s); cursor:pointer;
  font:400 12px var(--sans); color:var(--text-2); text-align:left;
}
.es-r svg{width:13px;height:13px;flex:none;stroke:var(--text-3);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.es-r span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.es-r:hover{background:var(--surface); color:var(--text)}
.es-r:hover svg{stroke:var(--text-2)}
#dropCard{
  margin-top:24px; width:min(420px,100%); border:1.5px dashed var(--border-3);
  border-radius:10px; padding:28px 22px; display:flex; flex-direction:column;
  align-items:center; gap:6px; color:var(--text-2); transition:border-color .12s, background .12s;
}
#dropCard svg{width:26px;height:26px;stroke:var(--text-3);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
#dropCard b{font-weight:600; color:var(--text)}
#dropCard small{color:var(--text-3); font-size:11.5px}
body.dragging #dropCard{border-color:var(--accent); background:var(--accent-soft)}
#emptyState .cta{display:flex; gap:8px; margin-top:20px}
#emptyState .note{margin-top:24px; font:400 11px var(--mono); color:var(--text-3)}

/* ============ overlays ============ */
#menu{
  position:fixed; z-index:90; display:none; min-width:210px;
  background:var(--raised); border:1px solid var(--border-3); border-radius:var(--r);
  padding:5px; box-shadow:var(--shadow); user-select:none;
}
#menu .mi{display:flex; align-items:center; gap:9px; padding:5px 9px; border-radius:4px; font:400 12px var(--sans); color:var(--text); cursor:pointer}
#menu .mi:hover{background:var(--accent-soft-2)}
#menu .mi.off{opacity:.4; pointer-events:none}
#menu .mi svg.i{color:var(--text-2)}
#menu .mi .k{margin-left:auto; font:400 10.5px var(--mono); color:var(--text-3)}
#menu .sep{height:1px; background:var(--border-2); margin:5px 4px}
#pop{
  position:fixed; z-index:85; display:none; width:min(420px,calc(100vw - 24px)); max-height:46vh; overflow:auto;
  background:var(--raised); border:1px solid var(--border-3); border-radius:var(--r); box-shadow:var(--shadow);
}
#pop h3{font:600 10.5px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); padding:11px 14px; border-bottom:1px solid var(--border-2); position:sticky; top:0; background:var(--raised)}
#pop ul{list-style:none}
#pop li{padding:9px 14px; border-bottom:1px solid var(--border-2); font:400 12px var(--mono)}
#pop li:last-child{border-bottom:none}
#pop li.warn{color:var(--warn)} #pop li.err{color:var(--err)}
#pop table{width:100%; border-collapse:collapse}
#pop td{padding:7px 14px; border-bottom:1px solid var(--border-2); font:400 12px var(--sans); color:var(--text-2)}
#pop td:last-child{text-align:right; font-family:var(--mono); color:var(--text); white-space:nowrap}
#pop tr:last-child td{border-bottom:none}
#toast{
  position:fixed; z-index:120; bottom:22px; left:50%; transform:translateX(-50%) translateY(6px);
  display:flex; align-items:center; gap:9px; padding:9px 16px; border-radius:var(--r);
  background:var(--raised); border:1px solid var(--border-3); box-shadow:var(--shadow);
  font:500 12.5px var(--sans); color:var(--text); opacity:0; pointer-events:none;
  transition:opacity .14s, transform .14s;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
#toast svg.i{color:var(--ok)} #toast.e svg.i{color:var(--err)}
#dropVeil{
  position:fixed; inset:0; z-index:70; display:none; place-items:center;
  background:rgba(19,18,17,.82); backdrop-filter:blur(2px);
}
#dropVeil .in{
  border:2px dashed var(--accent); border-radius:14px; padding:44px 60px;
  display:flex; flex-direction:column; align-items:center; gap:10px; color:var(--text);
  font:600 15px var(--sans); background:var(--accent-soft);
}
#dropVeil .in small{font:400 12px var(--sans); color:var(--text-2)}
#dropVeil svg{width:30px;height:30px;stroke:var(--accent-hover);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
body.dragging #dropVeil{display:grid}
body.dragging.no-doc #dropVeil{display:none}

/* ---- lightbox (full size) ---- */
#lightbox{position:fixed; inset:0; z-index:100; display:none; flex-direction:column; background:rgba(13,12,11,.94); backdrop-filter:blur(3px)}
#lightbox.open{display:flex}
#lbBar{
  flex:none; display:flex; align-items:center; gap:10px; padding:10px 16px;
  border-bottom:1px solid var(--border-2); background:var(--surface);
}
#lbName{font:600 12.5px var(--sans); color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#lbCtl{margin-left:auto; display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
#lbBody{flex:1; overflow:auto; min-height:0; padding:18px; display:grid; place-items:center}
#lbBody.top{place-items:start center}
#lbBody > .fitcanvas-wrap{line-height:0}
#lbBody .card{background:var(--surface); width:min(1100px,94vw)}
#lbBody .v3wrap{width:min(1400px,96vw); height:calc(100vh - 110px)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body class="no-doc">

<div id="titlebar">
  <div class="tb-left">
    <div class="brand">
      <span class="mark"></span>
      <span class="name">VPP<b>FORGE</b></span>
    </div>
    <div id="menubar">
      <button data-m="file">File</button>
      <button data-m="action">Action</button>
      <button data-m="tools">Tools</button>
      <button data-m="help">Help</button>
    </div>
    <div id="docChip"><span class="dirty"></span><span class="fname empty">No VPP open</span><span id="docStats" style="color:var(--text-3)"></span></div>
  </div>
  <div class="tb-actions">
    <button class="btn icon" id="btnFlip" title="Swap panel sides" aria-label="Swap panel sides">
      <svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/><path d="M10 12h4M12 10l2 2-2 2"/></svg>
    </button>
    <button class="btn icon" id="btnTheme" title="Switch to dark theme" aria-label="Switch theme">
      <svg class="i" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </div>
</div>

<div id="toolbar">
  <button class="btn tool" id="btnNew">
    <svg class="i" viewBox="0 0 24 24"><path d="M13 4H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V10zm0 0v6h6"/></svg>
    New
  </button>
  <button class="btn tool" id="btnOpen">
    <svg class="i" viewBox="0 0 24 24"><path d="M3.5 7V5.5a1.5 1.5 0 011.5-1.5h4l2 2.5h8a1.5 1.5 0 011.5 1.5V9M3.5 7h17l-1.6 11a1.5 1.5 0 01-1.5 1.3H6.6a1.5 1.5 0 01-1.5-1.3z"/></svg>
    Open<span class="k">Ctrl O</span>
  </button>
  <button class="btn tool primary" id="btnSave" disabled title="Save this VPP in place (Ctrl S)">
    <svg class="i" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 19h16"/></svg>
    Save
  </button>
  <button class="btn tool" id="btnSaveAs" disabled title="Save to a new file or location">
    <svg class="i" viewBox="0 0 24 24"><path d="M12 3v10m0 0l-4-4m4 4l4-4M4 17h6m4 0h6M4 21h16"/></svg>
    Save As
  </button>
  <span class="tb-sep" aria-hidden="true"></span>
  <button class="btn tool" id="btnAdd" title="Add files to the VPP">
    <svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    Add
  </button>
  <button class="btn tool" id="btnRemove" title="Remove selected (Del)" disabled>
    <svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m-9 0l1 13h8l1-13"/></svg>
    Remove
  </button>
  <button class="btn tool" id="btnExtract" title="Extract selected to a folder" disabled>
    <svg class="i" viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>
    Extract
  </button>
  <span class="grow"></span>
  <label class="search">
    <svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
    <input id="search" type="text" placeholder="Filter files" autocomplete="off" spellcheck="false">
    <span class="k">Ctrl F</span>
  </label>
</div>

<div id="workspace">
  <div id="sidebar">
    <div id="typeTree"></div>
    <div id="hdiv" aria-hidden="true"></div>
    <div id="prevPane">
      <div id="prevHead"><div id="prevName"></div><span id="prevActs"></span></div>
      <div id="prevMeta"></div>
      <div id="prevBody" class="center">
        <div class="placeholder">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 4.5v5"/></svg>
          <div class="t">Nothing selected</div>
          <div>Select a file to preview it here</div>
        </div>
      </div>
    </div>
  </div>

  <div id="vdiv" aria-hidden="true"></div>

  <div id="listCol">
    <div id="colHead">
      <span data-k="name">Name</span>
      <span data-k="type">Type</span>
      <span class="inf">Info</span>
      <span data-k="size" class="sz">Size</span>
    </div>
    <div id="rows" role="listbox" aria-label="VPP files"></div>
    <div id="listFoot">
      <span class="grow" id="footStats"></span>
      <span id="footSel"></span>
      <span id="checksChip" role="button" tabindex="0">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 4L2.5 20h19L12 4zm0 6v4.5m0 3v.5"/></svg>
        <span id="checksN"></span>
      </span>
    </div>
  </div>
</div>

<div id="emptyState">
  <span class="mark es-mark"></span>
  <h1>VPP Forge <span id="esVer"></span></h1>

    const pre=snapEntries();

      const low=nm.toLowerCase();
      const ex=state.entries.find(x=>x.name.toLowerCase()===low);
      if(ex){ex.data=new Uint8Array(ab);ex.size=ex.data.length;ex.offset=null;ex.name=nm;decodeCache.delete(ex.id);probeInfo(ex);replaced++;lastId=ex.id;}
      else{const e={name:nm,size:ab.byteLength,offset:null,data:new Uint8Array(ab),id:nextId++};probeInfo(e);state.entries.push(e);added++;lastId=e.id;}
    }

      state.dirty=true;
      if(lastId!=null){state.sel.clear();state.sel.add(lastId);state.anchor=lastId;}
    }

/* The written file was streamed out in pieces, so there is no consolidated
   buffer to keep. Give every entry its own bytes (subarray views cost
   nothing) and record where each one landed in the file just written. */
function commitSaved(nm){
  const src=state.srcBytes;
  for(const e of state.entries)
    if(!e.data&&src&&e.offset!=null)e.data=src.subarray(e.offset,e.offset+e.size);
  state.srcBytes=null;
  let off=align2048(SECTOR+64*state.entries.length);
  for(const e of state.entries){e.offset=off;off+=align2048(e.size);}
  state.dirty=false;
  if(nm)state.name=nm;
  refreshAll();
}

/* ---- TGA → DDS conversion · DXT encoder ported from RED Companion ----
   Bounding-box endpoints with 1/16 inset; DXT1 when fully opaque, DXT5 when
   any pixel has alpha, matching the companion's auto mode. */
function dxtQuantize565(r,g,b){
  const r5=Math.min(31,Math.max(0,Math.round(r*31/255)));
  const g6=Math.min(63,Math.max(0,Math.round(g*63/255)));
  const b5=Math.min(31,Math.max(0,Math.round(b*31/255)));
  return (r5<<11)|(g6<<5)|b5;
}
function dxtUnpack565(c){
  const r5=(c>>11)&0x1F,g6=(c>>5)&0x3F,b5=c&0x1F;
  return [(r5<<3)|(r5>>2),(g6<<2)|(g6>>4),(b5<<3)|(b5>>2)];
}
function dxtColorBlock(block,dest,off){
  let minR=255,minG=255,minB=255,maxR=0,maxG=0,maxB=0;
  for(let i=0;i<16;i++){
    const r=block[i*4],g=block[i*4+1],b=block[i*4+2];
    if(r<minR)minR=r; if(g<minG)minG=g; if(b<minB)minB=b;
    if(r>maxR)maxR=r; if(g>maxG)maxG=g; if(b>maxB)maxB=b;
  }
  const iR=(maxR-minR)>>4,iG=(maxG-minG)>>4,iB=(maxB-minB)>>4;
  minR+=iR;minG+=iG;minB+=iB;maxR-=iR;maxG-=iG;maxB-=iB;
  let c0=dxtQuantize565(maxR,maxG,maxB),c1=dxtQuantize565(minR,minG,minB);
  if(c0<c1){const t=c0;c0=c1;c1=t;}
  const [r0,g0,b0]=dxtUnpack565(c0),[r1,g1,b1]=dxtUnpack565(c1);
  const palR=[r0,r1,Math.round((2*r0+r1)/3),Math.round((r0+2*r1)/3)];
  const palG=[g0,g1,Math.round((2*g0+g1)/3),Math.round((g0+2*g1)/3)];
  const palB=[b0,b1,Math.round((2*b0+b1)/3),Math.round((b0+2*b1)/3)];
  let lo=0,hi=0;
  for(let i=0;i<16;i++){
    const r=block[i*4],g=block[i*4+1],b=block[i*4+2];
    let best=Infinity,bj=0;
    for(let j=0;j<4;j++){
      const dr=r-palR[j],dg=g-palG[j],db=b-palB[j];
      const d=dr*dr+dg*dg+db*db;
      if(d<best){best=d;bj=j;}
    }
    if(i<8)lo|=bj<<(i*2); else hi|=bj<<((i-8)*2);
  }
  dest[off]=c0&0xFF;dest[off+1]=(c0>>8)&0xFF;
  dest[off+2]=c1&0xFF;dest[off+3]=(c1>>8)&0xFF;
  dest[off+4]=lo&0xFF;dest[off+5]=(lo>>8)&0xFF;
  dest[off+6]=hi&0xFF;dest[off+7]=(hi>>8)&0xFF;
}
function dxtAlphaBlock(block,dest,off){
  let minA=255,maxA=0;
  for(let i=0;i<16;i++){const a=block[i*4+3];if(a<minA)minA=a;if(a>maxA)maxA=a;}
  const a0=maxA,a1=minA;
  const pal=new Uint8Array(8);
  pal[0]=a0;pal[1]=a1;
  if(a0>a1){for(let i=1;i<=6;i++)pal[1+i]=Math.round(((7-i)*a0+i*a1)/7);}
  else{for(let i=2;i<8;i++)pal[i]=a0;}
  let lo=0,hi=0;
  for(let i=0;i<16;i++){
    const a=block[i*4+3];
    let best=256,bj=0;
    for(let j=0;j<8;j++){const d=Math.abs(a-pal[j]);if(d<best){best=d;bj=j;}}
    if(i<8)lo|=bj<<(i*3); else hi|=bj<<((i-8)*3);
  }
  dest[off]=a0;dest[off+1]=a1;
  dest[off+2]=lo&0xFF;dest[off+3]=(lo>>8)&0xFF;dest[off+4]=(lo>>16)&0xFF;
  dest[off+5]=hi&0xFF;dest[off+6]=(hi>>8)&0xFF;dest[off+7]=(hi>>16)&0xFF;
}
function encodeDds(w,h,px,wantDXT5){
  if(w<4||h<4)throw new Error("smaller than 4×4");
  const bw=(w+3)>>2,bh=(h+3)>>2;
  const blockSize=wantDXT5?16:8;
  const dataSize=bw*bh*blockSize;
  const out=new Uint8Array(128+dataSize);
  const hv=new DataView(out.buffer);
  hv.setUint32(0,0x20534444,true);
  hv.setUint32(4,124,true);
  hv.setUint32(8,0x1|0x2|0x4|0x1000|0x80000,true);
  hv.setUint32(12,h,true);
  hv.setUint32(16,w,true);
  hv.setUint32(20,dataSize,true);
  hv.setUint32(76,32,true);
  hv.setUint32(80,0x04,true);
  out[84]=0x44;out[85]=0x58;out[86]=0x54;out[87]=wantDXT5?0x35:0x31;
  hv.setUint32(108,0x1000,true);
  const block=new Uint8Array(64);
  let dest=128;
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
    for(let py=0;py<4;py++){
      const sy=Math.min(by*4+py,h-1);
      for(let pxi=0;pxi<4;pxi++){
        const sx=Math.min(bx*4+pxi,w-1);
        const s=(sy*w+sx)*4,d=(py*4+pxi)*4;
        block[d]=px[s];block[d+1]=px[s+1];block[d+2]=px[s+2];block[d+3]=px[s+3];
      }
    }
    if(wantDXT5){dxtAlphaBlock(block,out,dest);dxtColorBlock(block,out,dest+8);dest+=16;}
    else{dxtColorBlock(block,out,dest);dest+=8;}
  }
  return out;
}
async function tgaEntriesToDds(list){

function download(bytes,name,mime){
  const blob=bytes instanceof Blob?bytes:new Blob([bytes],{type:mime});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;

}
function computeChecks(){
  const w=[];
  const seen=new Map();
  for(const e of state.entries){
    const low=e.name.toLowerCase();
    if(seen.has(low))w.push(["err","Duplicate name: "+e.name+". The game only ever sees the first copy."]);
    seen.set(low,1);
    if(e.name.length>NAME_MAX)w.push(["err","Name over "+NAME_MAX+" chars, will be truncated on save: "+e.name]);
    if(/[^\x20-\x7E]/.test(e.name))w.push(["warn","Non-ASCII characters in name: "+e.name]);
    if(e.size===0)w.push(["warn","Zero-byte file: "+e.name]);
    if(e.tkey==="dds"&&e.size>=128){
      try{
        const d=entryData(e);
        const dv=new DataView(d.buffer,d.byteOffset,d.byteLength);
        if(dv.getUint32(0,true)===0x20534444){
          const dh=dv.getUint32(12,true),dw=dv.getUint32(16,true);
          const fcc=dv.getUint32(84,true);
          const isDxt=fcc===0x31545844||fcc===0x33545844||fcc===0x35545844;
          if(isDxt&&(dw%4||dh%4))
            w.push(["err","DXT size not a multiple of 4 ("+dw+"×"+dh+"), crashes the D3D11 renderer: "+e.name]);
        }
      }catch(_){}
    }
  }
  let total=align2048(SECTOR+64*state.entries.length);
  for(const e of state.entries)total+=align2048(e.size);
  if(total>0xFFFFFFFF)w.push(["err","This VPP exceeds 4 GB. The size field is 32-bit and the game cannot read it."]);
  return {checks:w,total};
}

function getDecoded(e,kind){
  const c=decodeCache.get(e.id);
  if(c&&c.kind===kind)return c.value;
  let v;
  const d=entryData(e);
  if(kind==="tga")v=decodeTga(d);
  else if(kind==="vbm")v=decodeVbm(d);
  else if(kind==="v3m")v=V3M.parse(d.slice().buffer);
  else if(kind==="vfx")v=VFX.parse(d.slice().buffer);
  else if(kind==="rfa")v=RFA.parse(d.slice().buffer);
  else if(kind==="pcx")v=decodePcx(d);
  else if(kind==="dds")v=decodeDds(d);
  else if(kind==="vf")v=decodeVf(d);
  decodeCache.set(e.id,{kind,value:v});
  return v;
}

function renderContent(body,e,big,acts){
  const d=entryData(e);
  const addAct=(icon,title,fn)=>{if(acts)acts.appendChild(prevActionBtn(icon,title,fn));};
  const addExpand=()=>addAct(IC.expand,"Open full size",()=>openLightbox(e));
  const addExtract=()=>addAct(IC.extract,"Extract this file",()=>extractIds(new Set([e.id])));
  body.className="";
  try{
    switch(TYPE_META[e.tkey].cat){
      case "image":{
        const ex=extOf(e.name);
        const kind=ex==="pcx"?"pcx":ex==="dds"?"dds":"tga";
        const img=getDecoded(e,kind);
        const meta=kind==="pcx"
          ?('<b>'+img.width+' × '+img.height+'</b> · '+img.bpp+'-bit'+(img.planes>1?' · '+img.planes+' planes':'')+(img.rle?' · RLE':'')+' · PCX')
          :kind==="dds"
          ?('<b>'+img.width+' × '+img.height+'</b> · '+img.fmtName+(img.mips>1?' · '+img.mips+' mips':'')+(img.hasAlpha?' · alpha':''))
          :('<b>'+img.width+' × '+img.height+'</b> · '+img.bpp+'-bit'+(img.imgType>=9?' · RLE':'')+(img.hasAlpha?' · alpha':''));
        renderImage(body,e,img,meta,big);
        addAct(IC.png,"Export as PNG",()=>exportCanvasPng(body.querySelector("canvas"),baseName(e.name)+".png"));
        addExpand();addExtract();
        return;
      }
      case "font":{
        const f=getDecoded(e,"vf");
        const atlas=vfAtlas(f);
        const meta='<b>'+f.numChars+' chars</b> · '+f.height+' px tall · '+f.fmtName+' · v'+f.ver;
        renderImage(body,e,atlas,meta,big);
        addAct(IC.png,"Export glyph atlas as PNG",()=>exportCanvasPng(body.querySelector("canvas"),baseName(e.name)+"_atlas.png"));
        addExpand();addExtract();
        return;
      }
      case "rfa":{
        /* if a character in this VPP has a matching skeleton, preview the
           animation playing on it; otherwise fall back to the info card */
        let host=null;
        try{
          const h=parseRfaHeader(d);
          if(h&&h.bones>0)host=state.entries.find(x=>{
            if(x.tkey!=="v3c")return false;
            try{const m=getDecoded(x,"v3m");return m.bones&&m.bones.length>=h.bones;}
            catch(_){return false;}
          })||null;
        }catch(_){}
        if(host){
          render3d(body,host,big,{rfa:e});
          addExpand();addExtract();
          return;
        }
        renderRfa(body,e,d);
        addExpand();addExtract();
        return;
      }
      case "anim":{
        const v=getDecoded(e,"vbm");
        renderVbm(body,e,v,big);
        addAct(IC.png,"Export current frame as PNG",()=>{
          const cv=body.querySelector("canvas");
          exportCanvasPng(cv,baseName(e.name)+"_f"+((+cv.dataset.frame||0)+1)+".png");
        });
        addExpand();addExtract();
        return;
      }
      case "model":{
        render3d(body,e,big);
        addAct(IC.png,"Snapshot as PNG",()=>{if(live3d)live3d.snapshot(baseName(e.name)+".png");});
        addExpand();addExtract();
        return;
      }
      case "audio":{
        renderAudio(body,e,d);
        addExtract();
        return;
      }
      case "level":{
        renderRfl(body,e,d);
        addExpand();addExtract();
        return;
      }
      case "text":{
        renderText(body,e,d,big);
        addExpand();addExtract();
        return;
      }
    }
    if(looksText(d)){renderText(body,e,d,big);addExpand();addExtract();return;}
  }catch(err){
    body.innerHTML='<div class="viewer-bar"><span class="vinfo"><span class="warn">Preview failed · '+esc(err.message)+'</span></span></div><div class="hexslot"></div>';
    hexInto(body.querySelector(".hexslot"),d);

function looksText(d){
  const n=Math.min(d.length,512);if(!n)return false;
  let bad=0;
  for(let i=0;i<n;i++){const b=d[i];if(b===9||b===10||b===13)continue;if(b<32||b===127)bad++;}

function fitCanvas(cv,mode){
  const w=+cv.dataset.w,h=+cv.dataset.h;
  cv.dataset.mode=mode;
  let scale;
  if(mode==="fit"){
    const box=cv.closest(".fitbox");
    const availW=Math.max(60,box.clientWidth-2);
    const availH=Math.max(60,box.clientHeight-2);
    scale=Math.min(1,availW/w,availH/h);
  }else scale=+mode;
  cv.style.width=Math.max(1,Math.round(w*scale))+"px";
  cv.classList.toggle("px",scale>=1);
}

function renderRfl(body,e,d){
  const dv=new DataView(d.buffer,d.byteOffset,d.byteLength);
  let rows="";
  if(d.length>=4&&dv.getUint32(0,true)===0xD4BADA55){
    const ver=dv.getUint32(4,true),ts=dv.getUint32(8,true);
    rows+='<div class="r"><span>Format</span><span>Red Faction level</span></div>';
    rows+='<div class="r"><span>Version</span><span>'+ver+' · 0x'+ver.toString(16).toUpperCase()+'</span></div>';
    if(ts>631152000&&ts<4102444800)rows+='<div class="r"><span>Saved</span><span>'+new Date(ts*1000).toISOString().replace("T"," ").slice(0,16)+' UTC</span></div>';
    const l=dv.getUint16(28,true);

function hexInto(slot,data){
  let shown=0; const CHUNK=4096;
  const card=document.createElement("div"); card.className="card";
  const pre=document.createElement("div"); pre.className="hex";
  card.appendChild(pre); slot.appendChild(card);
  const more=document.createElement("button");
  more.className="btn outline sm"; more.style.marginTop="8px";
  slot.appendChild(more);
  const render=()=>{
    const end=Math.min(shown+CHUNK,data.length);
    let out="";
    for(let o=shown;o<end;o+=16){
      let hx="",asc="";
      for(let i=0;i<16;i++){
        if(o+i<data.length){
          const b=data[o+i];
          hx+=b.toString(16).padStart(2,"0")+(i===7?"  ":" ");
          asc+=b>=32&&b<127?String.fromCharCode(b):"·";
        }else hx+="   "+(i===7?" ":"");

    more.style.display=shown<data.length?"inline-flex":"none";
    more.textContent="Show more · "+fmtBytes(data.length-shown)+" remaining";

let threePromise=null;
function loadThree(){
  if(window.THREE)return Promise.resolve();

    s.onload=()=>res();

    document.head.appendChild(s);

    if(mode==="rot"){
      orbit.theta+=dx*0.0085;
      orbit.phi=Math.min(Math.PI-0.05,Math.max(0.05,orbit.phi-dy*0.0085));
    }else{
      const k=orbit.dist*0.0016;
      const right=new T.Vector3().setFromMatrixColumn(camera.matrix,0);
      const up=new T.Vector3().setFromMatrixColumn(camera.matrix,1);
      orbit.target.addScaledVector(right,-dx*k).addScaledVector(up,dy*k);
    }
    applyCam();
  });
  el.addEventListener("pointerup",()=>mode=null);
  el.addEventListener("wheel",ev=>{
    ev.preventDefault();
    orbit.dist=Math.min(radius*40,Math.max(radius*0.1,orbit.dist*Math.exp(ev.deltaY*0.0012)));
    applyCam();
  },{passive:false});
  if(ui.wireBtn)ui.wireBtn.addEventListener("click",()=>{
    wireOn=!wireOn;
    if(group)group.traverse(o=>{if(o.isMesh)o.material.wireframe=wireOn;});
    ui.wireBtn.style.color=wireOn?"var(--accent-hover)":"";
  });
  if(ui.resetBtn)ui.resetBtn.addEventListener("click",()=>{
    orbit.theta=home.theta;orbit.phi=home.phi;orbit.dist=home.dist;orbit.target.copy(home.target);
    applyCam();
  });
  if(ui.lodSeg){
    ui.lodSeg.querySelectorAll("button").forEach((b,i)=>b.addEventListener("click",()=>{
      ui.lodSeg.querySelectorAll("button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      lodIdx=i;
      build();
    }));
  }
  return {
    resize:size,
    get isAnimated(){return !!animCur;},
    play(){if(animCur){playing=true;if(ui.onPlayState)ui.onPlayState(true);}},
    pause(){playing=false;lastNow=0;if(ui.onPlayState)ui.onPlayState(false);},
    toggle(){if(!animCur)return;playing=!playing;if(!playing)lastNow=0;if(ui.onPlayState)ui.onPlayState(playing);},
    seek(frac){
      if(!animCur)return;
      playing=false;lastNow=0;
      clock=animCur.start+Math.max(0,Math.min(1,frac))*(animCur.end-animCur.start);
      applyClock();
      if(ui.onPlayState)ui.onPlayState(false);
      if(ui.onProgress)ui.onProgress(frac,clock);
    },
    setRfa(anim){
      playing=false;lastNow=0;
      if(!anim){
        animCur=null;
        if(V3M.resetPose)V3M.resetPose(group);
        if(ui.onPlayState)ui.onPlayState(false);
        return;
      }
      animCur={start:anim.startT,end:anim.endT,apply:t=>RFA.applyPose(group,anim,t)};
      clock=anim.startT;
      applyClock();
      if(ui.onPlayState)ui.onPlayState(false);
      if(ui.onProgress)ui.onProgress(0,clock);
    },
    snapshot(name){
      renderer.render(scene,camera);
      renderer.domElement.toBlob(b=>{if(b)download(b,name);else toast("Snapshot failed",true);},"image/png");
    },
    dispose(){
      alive=false;cancelAnimationFrame(raf);
      if(group)disposeGroup(group);
      if(grid){grid.geometry.dispose();grid.material.dispose();}
      for(const t of madeTex)t.dispose();
      renderer.dispose();
      if(el.parentNode)el.parentNode.removeChild(el);
    }
  };
}

function sanitizeVppName(nv){
  nv=(nv||"").trim().replace(/[\\/:*?"<>|]/g,"");
  if(!nv)return null;
  if(!/\.vpp$/i.test(nv))nv+=".vpp";
  if(nv.length>NAME_MAX)nv=nv.slice(0,NAME_MAX-4)+".vpp";
  return nv;
}
function beginDocRename(){

    return;
  }
  const chip=$("docChip"),span=chip.querySelector(".fname");
  const old=state.name;
  const inp=document.createElement("input");
  inp.maxLength=NAME_MAX;
  inp.spellcheck=false;
  inp.value=old;
  span.style.display="none";
  chip.insertBefore(inp,span);
  inp.focus();
  const dot=old.lastIndexOf(".");
  inp.setSelectionRange(0,dot>0?dot:old.length);
  let done=false;
  const commit=okv=>{
    if(done)return;done=true;

  };
  inp.addEventListener("keydown",ke=>{
    if(ke.key==="Enter")commit(true);
    else if(ke.key==="Escape")commit(false);
    ke.stopPropagation();
  });
  inp.addEventListener("blur",()=>commit(true));
}

/* rubber-band selection: drag in the list to select a range; Ctrl adds */
(function(){
  const rowsEl=$("rows");
  let active=false,started=false,sx=0,syc=0,base=null,raf=0,lastEv=null;
  const mq=document.createElement("div");
  mq.id="marquee";
  document.body.appendChild(mq);
  const contentY=(ev,rect)=>ev.clientY-rect.top+rowsEl.scrollTop;
  function update(){
    raf=0;
    if(!started||!lastEv)return;
    const rect=rowsEl.getBoundingClientRect(),ev=lastEv;
    if(ev.clientY>rect.bottom-10)rowsEl.scrollTop+=Math.min(28,ev.clientY-rect.bottom+10);
    else if(ev.clientY<rect.top+10)rowsEl.scrollTop-=Math.min(28,rect.top+10-ev.clientY);
    const cy=contentY(ev,rect);
    const y0=Math.min(syc,cy),y1=Math.max(syc,cy);
    const x0=Math.max(rect.left,Math.min(sx,ev.clientX));
    const x1=Math.min(rect.right,Math.max(sx,ev.clientX));
    const dy0=Math.max(rect.top,y0-rowsEl.scrollTop+rect.top);
    const dy1=Math.min(rect.bottom,y1-rowsEl.scrollTop+rect.top);
    mq.style.display="block";
    mq.style.left=x0+"px";
    mq.style.top=dy0+"px";
    mq.style.width=Math.max(0,x1-x0)+"px";
    mq.style.height=Math.max(0,dy1-dy0)+"px";
    const sel=new Set(base);
    for(const r of rowsEl.children){
      if(!r.dataset||!r.dataset.id)continue;
      const t=r.offsetTop,b=t+r.offsetHeight;
      if(b>y0&&t<y1)sel.add(+r.dataset.id);
    }
    if(sel.size!==state.sel.size||[...sel].some(id=>!state.sel.has(id))){
      state.sel=sel;
      renderRows();renderChrome();
    }
  }
  rowsEl.addEventListener("pointerdown",ev=>{
    if(ev.button!==0||ev.shiftKey)return;
    active=true;started=false;lastEv=null;
    sx=ev.clientX;
    syc=contentY(ev,rowsEl.getBoundingClientRect());
    base=(ev.ctrlKey||ev.metaKey)?new Set(state.sel):new Set();
  });
  window.addEventListener("pointermove",ev=>{
    if(!active)return;
    lastEv=ev;
    if(!started){
      if(Math.abs(ev.clientX-sx)+Math.abs(contentY(ev,rowsEl.getBoundingClientRect())-syc)<6)return;
      started=true;
    }
    if(!raf)raf=requestAnimationFrame(update);
  });
  window.addEventListener("pointerup",()=>{
    if(!active)return;
    active=false;
    if(raf){cancelAnimationFrame(raf);raf=0;}
    if(started){
      update(); /* apply the final drag position even if the last frame never painted */
      started=false;
      mq.style.display="none";
      if(state.sel.size&&(state.anchor==null||!state.sel.has(state.anchor)))state.anchor=[...state.sel][0];
      renderPreview();
      const swallow=ev=>{ev.stopPropagation();};
      window.addEventListener("click",swallow,{capture:true,once:true});
      setTimeout(()=>window.removeEventListener("click",swallow,{capture:true}),0);
    }
  });
})();
$("rows").addEventListener("click",ev=>{
  const r=ev.target.closest(".row");
  if(!r)return;
  const id=+r.dataset.id;
  const vis=visible().map(x=>x.e.id);
  if(ev.shiftKey&&state.anchor!=null){
    const a=vis.indexOf(state.anchor),b=vis.indexOf(id);
    if(a>=0&&b>=0){state.sel.clear();for(let i=Math.min(a,b);i<=Math.max(a,b);i++)state.sel.add(vis[i]);}
  }else if(ev.ctrlKey||ev.metaKey){
    state.sel.has(id)?state.sel.delete(id):state.sel.add(id);
    state.anchor=id;
  }else{
    state.sel.clear();state.sel.add(id);state.anchor=id;

document.addEventListener("keydown",ev=>{
  if(ev.target.tagName==="INPUT")return;
  const mod=ev.ctrlKey||ev.metaKey;
  const k=ev.key.toLowerCase();
  const lbOpen=$("lightbox").classList.contains("open");
  if(ev.key==="Escape"){
    if(lbOpen){closeLightbox();return;}
    closeMenu();closePop();
    if(state.sel.size){state.sel.clear();renderRows();renderChrome();renderPreview();}
    return;
  }
  if(lbOpen)return;
  if(mod&&k==="o"){ev.preventDefault();openArchiveDialog();}
  else if(mod&&k==="s"&&ev.shiftKey){ev.preventDefault();if(!$("btnSaveAs").disabled)saveArchive(true);}
  else if(mod&&k==="s"){ev.preventDefault();if(!$("btnSave").disabled)saveArchive();}
  else if(mod&&k==="e"){ev.preventDefault();if(state.sel.size)extractIds(state.sel);}
  else if(mod&&k==="f"){ev.preventDefault();$("search").focus();$("search").select();}
  else if(mod&&k==="a"){ev.preventDefault();selectAll();}
  else if(mod&&k==="z"&&!ev.shiftKey){ev.preventDefault();undo();}
  else if(mod&&(k==="y"||(k==="z"&&ev.shiftKey))){ev.preventDefault();redo();}
  else if(mod&&k==="d"){ev.preventDefault();if(state.sel.size)duplicateSelected();}
  else if(ev.key==="Delete"&&state.sel.size)removeSelected();
  else if(ev.key==="F2"&&state.sel.size===1)beginRename([...state.sel][0]);
  else if(ev.key==="Enter"&&state.sel.size===1){
    const e=byId([...state.sel][0]);
    if(e&&EXPANDABLE.has(TYPE_META[e.tkey].cat)){ev.preventDefault();openLightbox(e);}
  }
  else if(ev.altKey&&ev.key==="ArrowUp"){ev.preventDefault();moveSelected(-1);}
  else if(ev.altKey&&ev.key==="ArrowDown"){ev.preventDefault();moveSelected(1);}
  /* walk the file list; Shift extends the selection from the anchor */
  else if(ev.key==="ArrowUp"||ev.key==="ArrowDown"||ev.key==="Home"||ev.key==="End"){
    const vis=visible().map(x=>x.e.id);
    if(!vis.length)return;
    ev.preventDefault();
    const curId=(state.cursor!=null&&vis.includes(state.cursor))?state.cursor:state.anchor;
    const cur=curId!=null?vis.indexOf(curId):-1;
    let next;
    if(ev.key==="Home")next=0;
    else if(ev.key==="End")next=vis.length-1;
    else if(cur<0)next=ev.key==="ArrowDown"?0:vis.length-1;
    else next=Math.max(0,Math.min(vis.length-1,cur+(ev.key==="ArrowDown"?1:-1)));
    const a=state.anchor!=null?vis.indexOf(state.anchor):-1;
    if(ev.shiftKey&&a>=0){
      state.sel.clear();
      for(let i=Math.min(a,next);i<=Math.max(a,next);i++)state.sel.add(vis[i]);
    }else{
      state.sel.clear();state.sel.add(vis[next]);state.anchor=vis[next];
    }
    state.cursor=vis[next];
    renderRows();renderChrome();renderPreview();scrollToRow(vis[next]);
  }
  /* space plays/pauses whatever the preview is showing: VFX effects,
     character animations, or audio */
  else if(ev.key===" "||ev.code==="Space"){
    const ae=document.activeElement;
    if(ae&&/^(BUTTON|SELECT|TEXTAREA|A|AUDIO|VIDEO)$/.test(ae.tagName))return; /* the focused control keeps it */
    if(live3d&&live3d.isAnimated){ev.preventDefault();live3d.toggle();return;}
    const au=document.querySelector("#lbBody audio,#prevBody audio");
    if(au){
      ev.preventDefault();
      if(au.paused)au.play().catch(()=>{});else au.pause();
    }
  }
  else if(ev.key==="?")showShortcuts();
});

(function loadSettings(){
  const apply=s=>{
    APP_SETTINGS=(s&&typeof s==="object")?s:{};
    if(APP_SETTINGS.dark)setTheme(true,false);
    if(APP_SETTINGS.flip)setFlip(true,false);
    if(APP_SETTINGS.sideW)sidebar.style.width=Math.min(560,Math.max(260,APP_SETTINGS.sideW))+"px";
    if(APP_SETTINGS.treeH)setTreeH(Math.max(66,APP_SETTINGS.treeH));
    if(APP_SETTINGS.sideW||APP_SETTINGS.treeH)refitAll();
  };
  if(BRIDGE)bridgeJson("/settings").then(apply).catch(()=>{});
  else{try{apply(JSON.parse(localStorage.getItem("vppforge-settings")||"{}"));}catch(_){}}
})();

  if(BRIDGE.ver)$("esVer").textContent="v"+BRIDGE.ver;
  bridgeJson("/open").then(j=>{
    if(j&&j.id!=null)bridgeLoad(j.id,j.name);
    else renderEmptyRecents();
  }).catch(()=>{});
  if(BRIDGE.installed)showWelcome(true);
  /* quiet check a few seconds in, so it never delays opening a file */
  setTimeout(()=>checkForUpdates(false),4000);
  /* link the game's own VPPs so stock textures resolve without setup */
  setTimeout(()=>{if((APP_SETTINGS.linkGame??1)===1)linkGameAssets(false);},1200);
}
</script>
</body>
</html>
