.hd img{height:34px;width:34px;object-fit:contain;filter:drop-shadow(0 0 6px #c8303044)}
.hd h1{font-family:'Arial Black',Arial,sans-serif;font-weight:700;font-size:17px;color:var(--cy);letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px var(--cg)}
.hd>span{font-size:12px;color:var(--td)}
.hdiv{width:2px;height:26px;background:var(--dm);margin:0 4px}
/* menu: a row of groups, then the tables of the open group */
.nav{flex-shrink:0;background:var(--br);border-bottom:2px solid var(--dm)}
.grps{display:flex;align-items:stretch;gap:2px;padding:0 8px;height:40px;border-bottom:1px solid var(--dd);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.grps::-webkit-scrollbar{display:none}
.grp{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:0 14px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'Arial Black',Arial,sans-serif;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--td);white-space:nowrap;transition:color .15s,background .15s}
.grp:hover{color:var(--ts);background:var(--bp)}
.grp.a{color:var(--cy);border-bottom-color:var(--cy);background:linear-gradient(180deg,transparent 40%,var(--cg))}
.grp .c,.tab .c{font-family:Consolas,monospace;font-size:10px;letter-spacing:0;font-weight:400;color:var(--tf)}
.grp.a .c,.tab.a .c{color:var(--cd)}
.grp.nil,.tab.nil{opacity:.4}
.grps .sp,.tabs .sp{flex:1}
.nav-btn{flex-shrink:0;align-self:center;height:26px;min-width:26px;padding:0 8px;background:var(--bp);border:1px solid var(--dm);border-radius:4px;color:var(--ts);font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.nav-btn:hover:not(:disabled){color:var(--cy);border-color:var(--cd)}
.nav-btn:disabled{opacity:.35;cursor:default}
.grps .nav-btn:first-child{margin-right:6px}
.tabs{display:flex;align-items:center;flex-wrap:wrap;gap:3px 4px;padding:5px 10px;min-height:38px;background:var(--bd)}
.tab{display:flex;align-items:center;gap:6px;padding:4px 11px;background:none;border:1px solid transparent;border-radius:4px;cursor:pointer;font-family:'Segoe UI',Tahoma,sans-serif;font-weight:600;font-size:12px;color:var(--td);white-space:nowrap;transition:color .15s,background .15s}
.tab:hover{color:var(--ts);background:var(--bp)}
.tab.a{color:var(--cy);border-color:var(--cd);background:var(--cg)}
.tabs .hint{font-size:12px;color:var(--tf);margin-left:6px}
.mp-tog{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--dd);border-radius:4px;font-size:12px;color:var(--ts);cursor:pointer;user-select:none}
.mp-tog:hover{border-color:var(--dm)}
.mp-tog input{accent-color:var(--cy);cursor:pointer}
@media (max-width:760px){.grp{padding:0 9px}.grp .c{display:none}}
.si-wrap{position:relative}
.si-wrap .si{padding-right:32px}
.si-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;border-radius:3px;background:none;color:var(--tf);font-size:16px;line-height:1;cursor:pointer;display:none}
.si-x:hover{color:var(--cy);background:var(--bp)}
.si-wrap.has .si-x{display:block}
.ft-wrap .ft-cp:not(:last-child){border-radius:0}
.ft-op{font-weight:700;color:var(--cy)}
.es-groups{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;max-width:780px;width:100%}
.es-g{background:var(--bd);border:1px solid var(--dd);border-radius:6px;padding:10px 12px;text-align:left}
.es-g h3{font-family:'Arial Black',Arial,sans-serif;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--td);margin-bottom:6px;cursor:pointer}
.es-g h3:hover{color:var(--cy)}
.es-t{display:flex;justify-content:space-between;gap:8px;padding:2px 5px;margin:0 -5px;border-radius:3px;font-size:12px;color:var(--ts);cursor:pointer}
.es-t:hover{background:var(--bh);color:var(--cy)}
.es-t b{font-family:Consolas,monospace;font-weight:400;color:var(--cy)}
.mn{display:flex;flex:1;overflow:hidden}
.back-btn{display:none;padding:4px 10px;background:var(--bp);border:1px solid var(--dm);border-radius:4px;color:var(--cy);font-size:12px;cursor:pointer;font-family:'Arial Black',Arial,sans-serif;margin-bottom:12px;align-items:center;gap:4px}
.back-btn:hover{background:var(--bh);border-color:var(--db)}
.back-btn.vis{display:inline-flex}
.ft-wrap{display:inline-flex;align-items:center;gap:0;margin:2px}
.ft-cp{display:inline-block;padding:2px 5px;border-radius:0 3px 3px 0;font-size:10px;cursor:pointer;background:var(--bp);border:1px solid var(--dm);border-left:none;color:var(--td);vertical-align:middle}
.ft-cp:hover{color:var(--cy);background:var(--bh)}
.ft-wrap .ft{border-radius:3px 0 0 3px}
.cp-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--cy);color:var(--bd);padding:6px 16px;border-radius:4px;font-size:12px;font-family:'Arial Black',Arial,sans-serif;z-index:999;opacity:0;transition:opacity .3s}
.cp-toast.show{opacity:1}
.li.kb{background:var(--bh);outline:1px solid var(--dm)}
.lp{width:310px;min-width:240px;border-right:2px solid var(--dm);display:flex;flex-direction:column;flex-shrink:0;background:var(--bd)}
.sa{padding:12px;border-bottom:1px solid var(--dd);flex-shrink:0}
.si{width:100%;padding:9px 12px;background:var(--sib);border:1px solid var(--dm);border-radius:4px;color:var(--tb);font-size:13px;outline:none}.si:focus{border-color:var(--cy)}.si::placeholder{color:var(--tf)}
.cf{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}

function matchItem(x,s){if(x.tx&&Array.isArray(x.tx)&&x.tx.some(t=>t.toLowerCase().includes(s)))return true;
  if(x.n.toLowerCase().includes(s)) return true;
  if(x.refs) return x.refs.some(r=>r.name.toLowerCase().includes(s)||r.tab.toLowerCase().includes(s));
  if(x.dn&&x.dn.toLowerCase().includes(s)) return true;
  if(x.sn&&x.sn.toLowerCase().includes(s)) return true;
  for(const k of ['v','fp','tp','sv','model','corona','vol','refl','img','hand','forearm','bicep','silv3d','bmpfn','glassdec','mfbmp','altmfbmp','scorch','wicon','hud_ret','hud_icon','zoomed_ret','locked_ret','impvclip','trail','dv','cv','hv','ck','ea'])
    if(x[k]&&x[k].toLowerCase().includes(s)) return true;
  const a=[...(x.st||[]),...(x.ac||[])];
  if(a.some(z=>z.f.toLowerCase().includes(s)||z.t.toLowerCase().includes(s))) return true;
  if(x.sk&&x.sk.some(sk=>sk.tx.some(t=>t.toLowerCase().includes(s))||sk.n.toLowerCase().includes(s))) return true;
  for(const k of ['wp','ws','gives','ammofor','ammo','rfe1','rfe2','mat','etype','corpse','emit','snd','use','launch','altlaunch','flysnd','impsnd','nearmiss','mzglare','warmfx','tp_mzglare','glare'])
    if(x[k]&&x[k].toLowerCase().includes(s)) return true;
  if(x.aw&&x.aw.some(w=>w.toLowerCase().includes(s))) return true;
  if(x.fl&&x.fl.some(f=>f.toLowerCase().includes(s))) return true;
  if(x.fpguns&&x.fpguns.some(g=>g.w.toLowerCase().includes(s)||g.cfg.toLowerCase().includes(s))) return true;
  if(x.icon&&x.icon.toLowerCase().includes(s)) return true;
  if(x.th&&x.th.some(t=>t.toLowerCase().includes(s))) return true;
  if(x.co&&x.co.some(c=>c.toLowerCase().includes(s))) return true;
  if(x.w&&x.w.some(w=>w.toLowerCase().includes(s))) return true;
  if(x.cat&&x.cat.toLowerCase().includes(s)) return true;
  return false;
}

function getSortKeys(){

function sortItems(arr){
  const dir=sortAsc?1:-1;
  return arr.sort((a,b)=>{

    if(sortKey==="dmg"){const av=parseFloat(a.dmg)||0,bv=parseFloat(b.dmg)||0;return dir*(av-bv)}
    if(sortKey==="vel"){const av=parseFloat(a.vel)||0,bv=parseFloat(b.vel)||0;return dir*(av-bv)}

function mpTextures(m){
  // Find entity and matching skin
  const ent=E.find(e=>e.n===m.etype);
  let bodyTxs=[],skinLabel=m.skin,meshFile='';
  if(ent){
    meshFile=ent.v||'';
    if(ent.sk&&ent.sk.length){
      let sk=ent.sk.find(s=>s.n.toLowerCase()===m.skin.toLowerCase());
      if(!sk&&m.skin==='default'&&ent.sk.length) sk=ent.sk[0];
      if(sk){skinLabel=sk.n;bodyTxs=[...sk.tx]}
    }
  }
  // Fallback: use hardcoded VCM textures if no skin matched
  if(!bodyTxs.length&&meshFile){
    const def=DEFAULT_MESH_TX[meshFile.toLowerCase()]||DEFAULT_MESH_TX[meshFile];
    if(def){bodyTxs=[...def];skinLabel='default (mesh)'}
  }
  // Collect unique arm textures from FP configs
  const armSet=new Set();
  for(const g of (m.fpguns||[])){
    const cfg=FP.find(f=>f.n===g.cfg);
    if(cfg){for(const k of ['hand','forearm','bicep']) if(cfg[k]) armSet.add(cfg[k])}
  }
  const armTxs=[...armSet].sort();
  // Deduplicated combined list
  const allSet=new Set();
  bodyTxs.forEach(t=>allSet.add(t));
  armTxs.forEach(t=>allSet.add(t));
  const allTxs=[...allSet].sort();
  // Build unique body list (deduped for display)
  const bodyUnique=[...new Set(bodyTxs)];
  return {meshFile,skinLabel,bodyTxs:bodyUnique,armTxs,allTxs};
}

function rSnd(s){
  let h=`<div class="dt-sticky"><div class="dt">${H(s.n)}</div>`;
  h+=`<span class="dc">${H(s.cat)}</span>`;
  if(s.m) h+=`<span class="dc">Material: ${H(s.m)}</span>`;
  // Check if this is a persona sound
  const perUses=[];
  for(const [pn,pd] of Object.entries(PERSONAS)){
    for(const [field,val] of Object.entries(pd)){
      if(val.toLowerCase()===s.n.toLowerCase()) perUses.push({persona:pn,field});
    }
  }
  if(perUses.length) h+=perUses.map(p=>`<span class="dc">Persona: ${H(p.persona)} → ${H(p.field)}</span>`).join('');
  h+=`<span class="dc">${s.w.length} wav file${s.w.length!==1?'s':''}</span>`;
  h+=`</div>`;
  // Wav files section
  let wh='<div style="display:flex;flex-wrap:wrap;gap:2px">'+s.w.map(w=>ft(w,'wav')).join('')+'</div>';
  h+=sec("Sound Files",s.w.length,wh);
  // Cross-references: which entities/weapons/clutter use this sound?
  let users=[];
  const sn=s.n;
  for(const e of E){
    const ex=EXT[e.n]||{};
    if(ex.plo===sn) users.push({n:e.n,tab:'entities',ctx:'low pain'});
    if(ex.phi===sn) users.push({n:e.n,tab:'entities',ctx:'high pain'});
    if(ex.dthsnd===sn) users.push({n:e.n,tab:'entities',ctx:'death'});
    if(ex.impdth===sn) users.push({n:e.n,tab:'entities',ctx:'impact death'});
    if(ex.jsnd===sn) users.push({n:e.n,tab:'entities',ctx:'jump'});
    if(e.flysnd===sn) users.push({n:e.n,tab:'entities',ctx:'fly sound'});
    if(ex.feet&&ex.feet.includes(sn)) users.push({n:e.n,tab:'entities',ctx:'footstep'});
    if(ex.lsnd&&ex.lsnd.includes(sn)) users.push({n:e.n,tab:'entities',ctx:'land sound'});
    for(const a of [...(e.st||[]),...(e.ac||[])]){if(a.s===sn) users.push({n:e.n,tab:'entities',ctx:'animation: '+a.t})}
  }
  for(const w of W){
    if(w.launch===sn) users.push({n:w.n,tab:'weapons',ctx:'launch sound'});
    if(w.altlaunch===sn) users.push({n:w.n,tab:'weapons',ctx:'alt launch'});
    if(w.flysnd===sn) users.push({n:w.n,tab:'weapons',ctx:'fly sound'});
    if(w.impsnd===sn) users.push({n:w.n,tab:'weapons',ctx:'impact sound'});
    if(w.startsnd===sn) users.push({n:w.n,tab:'weapons',ctx:'start sound'});
    if(w.stopsnd===sn) users.push({n:w.n,tab:'weapons',ctx:'stop sound'});
    if(w.nearmiss===sn) users.push({n:w.n,tab:'weapons',ctx:'near miss'});
    for(const a of [...(w.st||[]),...(w.ac||[])]){if(a.s===sn) users.push({n:w.n,tab:'weapons',ctx:'animation: '+a.t})}
  }
  for(const c of C){
    if(c.snd===sn) users.push({n:c.n,tab:'clutter',ctx:'loop sound'});
    if(c.usesnd===sn) users.push({n:c.n,tab:'clutter',ctx:'use sound'});
    if(c.dsnd===sn) users.push({n:c.n,tab:'clutter',ctx:'debris sound'});
  }
  // Check personas
  for(const [pn,pd] of Object.entries(PERSONAS)){
    for(const [field,val] of Object.entries(pd)){
      if(val.toLowerCase()===sn.toLowerCase()){
        const ents=E.filter(e=>e.per===pn);
        if(ents.length) ents.forEach(e=>users.push({n:e.n,tab:'entities',ctx:'persona: '+field}));
        else users.push({n:pn,tab:'',ctx:'persona: '+field});
      }
    }
  }
  // Deduplicate
  const seen=new Set();
  users=users.filter(u=>{const k=u.tab+':'+u.n;if(seen.has(k)) return false;seen.add(k);return true});
  if(users.length){
    const byTab={};
    for(const u of users){if(!byTab[u.tab]) byTab[u.tab]=[];byTab[u.tab].push(u)}
    let xr='';
    for(const [tab,items] of Object.entries(byTab)){
      const label=TABS.find(t=>t.i===tab);
      xr+=`<div style="margin-bottom:6px"><div style="color:var(--td);font-size:11px;font-weight:700;margin-bottom:3px">${label?label.l:tab} (${items.length})</div>`;
      xr+=items.map(u=>`<div style="margin:2px 0">${u.tab?`<a class="xref" ${nav(u.tab,u.n)}>${H(u.n)}</a>`:`<span style="color:var(--ts)">${H(u.n)}</span>`} <span style="color:var(--tf);font-size:10px">${u.ctx}</span></div>`).join('');
      xr+=`</div>`;
    }
    h+=sec("Used By",users.length,xr);
  }
  return h;
}

function rFI(fi){
  let h=`<div class="dt-sticky"><div class="dt">${H(fi.n)}</div>`;
  const ext=fc(fi.n);
  h+=`<span class="dc">${ext.toUpperCase()} file</span><span class="dc">Referenced ${fi.refs.length} time${fi.refs.length!==1?'s':''}</span></div>`;
  // Group refs by tab
  const byTab={};
  for(const r of fi.refs){if(!byTab[r.tab]) byTab[r.tab]=[];byTab[r.tab].push(r.name)}
  let body="";
  for(const [tab,names] of Object.entries(byTab)){
    const label=TABS.find(t=>t.i===tab)||{l:tab};
    body+=`<div style="margin-bottom:8px"><div style="color:var(--td);font-size:12px;margin-bottom:4px;font-weight:700">${label?label.l:tab} (${names.length})</div>`;
    body+=names.map(n=>`<div style="margin:2px 0"><a class="xref" ${nav(tab,n)}>${H(n)}</a></div>`).join("");
    body+=`</div>`;
  }
  h+=sec("Referenced By",fi.refs.length,body);
  return h;
}

function rD(){
  const el=document.getElementById("rp");
  el.scrollTop=0;
  if(compareMode){renderCompareView();return}
  const backHtml='';   /* Back lives in the menu (the arrow left of the groups) */
  if(!sN){el.innerHTML=backHtml+showLanding()+compareTrayHtml();return}
  const tab=cT;
  if(tab==="skins"){
    const s=SK.find(d=>d.n===sN);
    if(!s){el.innerHTML=backHtml+`<div class="es">Select a skin</div>`;return}
    let h=`<div class="dt-sticky"><div class="dt">${H(s.en)}</div></div><div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap">`;
    h+=`<span class="dc">Skin "${H(s.sn)}"</span>`;
    if(s.mp){const chars=M.filter(m=>m.etype===s.en&&m.skin.toLowerCase()===s.sn.toLowerCase()).map(m=>m.sn||m.n);h+=`<span class="mp-badge">MP</span><span style="font-size:10px;color:var(--td)">${chars.join(', ')}</span>`}
    h+=`<span class="dc">${H(s.src)}</span></div>`;
    const txJson=JSON.stringify(s.tx).replace(/'/g,"\\'");
    h+=sec("Textures",s.tx.length,`<div style="margin-bottom:6px"><span class="cp-all" onclick="cpAll('${txJson}',event)" title="Copy all textures">Copy All</span></div><div style="display:flex;flex-wrap:wrap;gap:3px">${s.tx.map(t=>ft(t,"tga")).join("")}</div>`);
    const ent=E.find(e=>e.n===s.en)||C.find(c=>c.n===s.en);
    if(ent&&ent.v) h+=sec("Mesh File",null,ft(ent.v));
    el.innerHTML=backHtml+h+compareTrayHtml();return;
  }
  if(tab==="files"){
    const x=FI.find(d=>d.n===sN);
    if(!x){el.innerHTML=backHtml+`<div class="es"><div class="h1">Not found</div></div>`+compareTrayHtml();return}
    el.innerHTML=backHtml+rFI(x)+compareTrayHtml();return;
  }
  const x=gdT(tab).find(d=>d.n===sN);
  if(!x){el.innerHTML=backHtml+`<div class="es"><div class="h1">Not found</div></div>`+compareTrayHtml();return}
  el.innerHTML=backHtml+(tab==="entities"?rEnt(x):tab==="weapons"?rWep(x):tab==="items"?rItm(x):tab==="clutter"?rClu(x):tab==="ammo"?rAmm(x):tab==="multi"?rMul(x):tab==="audio"?rSnd(x):tab==="vclips"?rVcl(x):tab==="explosions"?rExp(x):tab==="emitters"?rEm(x):tab==="materials"?rMat(x):tab==="movemodes"?rMM(x):rFX(x))+compareTrayHtml()
}

// Keyboard navigation
document.addEventListener("keydown",e=>{
  const si=document.getElementById("si"),typing=document.activeElement&&document.activeElement.tagName==="INPUT";
  /* inside VPP Forge its own Ctrl shortcuts still work from here */
  if(HOST&&HOST.key&&(e.ctrlKey||e.metaKey)&&!e.altKey&&/^[gos]$/i.test(e.key)){e.preventDefault();HOST.key(e.key.toLowerCase(),e.shiftKey);return}
  if((e.ctrlKey||e.metaKey)&&e.key==="f"){e.preventDefault();si.focus();si.select();return}
  if(e.key==="/"&&!typing){e.preventDefault();si.focus();si.select();return}
  if(e.key==="?"&&!typing){e.preventDefault();document.getElementById("kbo").classList.toggle("show");return}
  if(document.getElementById("kbo").classList.contains("show")){if(e.key==="Escape"){e.preventDefault();document.getElementById("kbo").classList.remove("show")}return}
  if(e.altKey&&!e.ctrlKey&&!e.metaKey&&/^[1-6]$/.test(e.key)){e.preventDefault();pickGroup(GROUPS[+e.key-1].i);return}
  if(e.key==="Escape"){
    e.preventDefault();
    if(document.activeElement===si&&cS) clearSearch();
    else if(navHist.length) goBack();
    else if(cS) clearSearch();
    else if(HOST&&HOST.close) HOST.close();
    return;
  }
  const items=document.querySelectorAll("#ls .li");
  if(!items.length) return;
  if(e.key==="ArrowDown"){e.preventDefault();kbIdx=Math.min(kbIdx+1,items.length-1);hlKb(items)}
  else if(e.key==="ArrowUp"){e.preventDefault();kbIdx=Math.max(kbIdx-1,0);hlKb(items)}
  else if(e.key==="Enter"&&kbIdx>=0&&kbIdx<items.length){e.preventDefault();items[kbIdx].click()}
});
function hlKb(items){
  items.forEach((el,i)=>{if(i===kbIdx){el.classList.add("kb");el.scrollIntoView({block:"nearest"})}else el.classList.remove("kb")});
}


let _sTimer=null;
function debSearch(){
  document.getElementById("siw").classList.toggle("has",!!document.getElementById("si").value);
  clearTimeout(_sTimer);
  _sTimer=setTimeout(()=>{
    const v=document.getElementById("si").value.trim();
    if(v===cS) return;
    if(!v){clearSearch();return}
    if(!cS) sScope=null;           /* a new search starts on every table */
    cS=v;sN=null;kbIdx=-1;rT();rCF();rL();rD();
  },120);
}

function rVcl(v){
  let h=`<div class="dt-sticky"><div class="dt">${H(v.n)}</div></div>`;
  const stats=[];
  if(v.dmg!==undefined) stats.push(['Damage', v.dmg]);
  if(v.pcount!==undefined) stats.push(['Particle Count', v.pcount]);
  if(v.vfxr!==undefined) stats.push(['VFX Radius', v.vfxr]);
  if(v.glow!==undefined) stats.push(['Glow', v.glow]);
  if(v.vbmglow!==undefined) stats.push(['VBM Glow', v.vbmglow]);
  if(stats.length) h+=statsBar(stats);

  let files='';
  if(v.vbm) files+=`<div class="mr"><span class="ml">VBM:</span>${ft(v.vbm,'vbm')}</div>`;
  if(v.vfx) files+=`<div class="mr"><span class="ml">VFX:</span>${ft(v.vfx,'vfx')}</div>`;
  if(v.bmp) files+=`<div class="mr"><span class="ml">Bitmap:</span>${ft(v.bmp,'tga')}</div>`;
  if(files) h+=sec('Files', null, files);

  let xrefs='';
  if(v.expl) xrefs+=`<div class="mr"><span class="ml">Explosion:</span><a class="xref" ${nav('explosions',v.expl)}>${H(v.expl)}</a></div>`;
  if(v.foley) xrefs+=`<div class="mr"><span class="ml">Foley Sound:</span>${sndLink(v.foley)}</div>`;
  if(xrefs) h+=sec('References', null, xrefs);

  let pflags='';
  if(v.flags) pflags+=`<div class="mr"><span class="ml">Flags:</span><span class="vc-flag">${H(String(v.flags))}</span></div>`;
  if(v.pflags) pflags+=`<div class="mr"><span class="ml">Particle Flags:</span><span class="vc-flag">${H(String(v.pflags))}</span></div>`;
  if(v.eflags) pflags+=`<div class="mr"><span class="ml">Emitter Flags:</span><span class="vc-flag">${H(String(v.eflags))}</span></div>`;
  if(pflags) h+=sec('Flags', null, pflags);

  // Particle physics block (only if particle vclip)
  if(v.pcount!==undefined){
    const part=[];
    if(v.minlife!==undefined||v.maxlife!==undefined) part.push(['Lifespan (s)', `${v.minlife??'?'} – ${v.maxlife??'?'}`]);
    if(v.minpr!==undefined||v.maxpr!==undefined) part.push(['Particle Radius', `${v.minpr??'?'} – ${v.maxpr??'?'}`]);
    if(v.minv!==undefined||v.maxv!==undefined) part.push(['Velocity', `${v.minv??'?'} – ${v.maxv??'?'}`]);
    if(v.growth!==undefined) part.push(['Growth Rate', v.growth]);
    if(v.accel!==undefined) part.push(['Acceleration', v.accel]);
    if(v.grav!==undefined) part.push(['Gravity Scale', v.grav]);
    if(v.bounce!==undefined) part.push(['Bounciness', v.bounce]);
    if(v.stick!==undefined) part.push(['Stickiness', v.stick]);
    if(v.spawn!==undefined) part.push(['Spawn Radius', v.spawn]);
    if(v.pcolor!==undefined) part.push(['Color', v.pcolor]);
    if(v.pcolord!==undefined) part.push(['Color Dest', v.pcolord]);
    if(part.length) h+=sec('Particle Physics', null, statsBar(part));
  }

  // Reverse cross-refs: which weapons/clutter/entities use this vclip
  const wepUsers=W.filter(w=>w.impvclip===v.n);
  if(wepUsers.length) h+=sec('Used by Weapons (impact vclip)', wepUsers.length, wepUsers.map(w=>`<div style="margin:3px 0"><a class="xref" ${nav('weapons',w.n)}>${H(w.n)}</a></div>`).join(''));
  return h;
}

function rExp(x){
  let h=`<div class="dt-sticky"><div class="dt">${H(x.n)}</div></div>`;
  const stats=[];
  if(x.playtime!==undefined) stats.push(['Play Time (s)', x.playtime]);
  if(x.flags) stats.push(['Flags', String(x.flags)]);
  if(stats.length) h+=statsBar(stats);

  if(x.cemits&&x.cemits.length){
    h+=sec('Central Emitters', x.cemits.length, x.cemits.map(e=>`<div class="mr"><a class="xref" ${nav('emitters',e)}>${H(e)}</a></div>`).join(''));
  }
  let trails='';
  if(x.sparks) trails+=`<div class="mr"><span class="ml">Sparks:</span><a class="xref" ${nav('emitters',x.sparks)}>${H(x.sparks)}</a></div>`;
  if(x.headtrail) trails+=`<div class="mr"><span class="ml">Trail Head:</span><a class="xref" ${nav('emitters',x.headtrail)}>${H(x.headtrail)}</a></div>`;
  if(x.tailtrail) trails+=`<div class="mr"><span class="ml">Trail Tail:</span><a class="xref" ${nav('emitters',x.tailtrail)}>${H(x.tailtrail)}</a></div>`;
  if(trails) h+=sec('Trail/Sparks Emitters', null, trails);

  // Reverse: vclips referencing this explosion
  const vUsers=VC.filter(v=>v.expl===x.n);
  if(vUsers.length) h+=sec('Used by Vclips', vUsers.length, vUsers.map(v=>`<div style="margin:3px 0"><a class="xref" ${nav('vclips',v.n)}>${H(v.n)}</a></div>`).join(''));
  // And entities/weapons/clutter with explosion = this name
  const eUsers=E.filter(e=>e.ea===x.n);
  if(eUsers.length) h+=sec('Used by Entities', eUsers.length, eUsers.map(e=>`<div style="margin:3px 0"><a class="xref" ${nav('entities',e.n)}>${H(e.n)}</a></div>`).join(''));
  const cUsers=C.filter(c=>c.ea===x.n);
  if(cUsers.length) h+=sec('Used by Clutter', cUsers.length, cUsers.map(c=>`<div style="margin:3px 0"><a class="xref" ${nav('clutter',c.n)}>${H(c.n)}</a></div>`).join(''));
  return h;
}

function rMat(m){
  let h=`<div class="dt-sticky"><div class="dt">${H(m.n)}</div></div>`;
  const stats=[];
  if(m.elast!==undefined) stats.push(['Elasticity', m.elast]);
  if(m.fric!==undefined) stats.push(['Friction', m.fric]);
  if(m.dens!==undefined) stats.push(['Density', m.dens]);
  if(m.buoy!==undefined) stats.push(['Buoyancy', m.buoy]);
  if(m.trac!==undefined) stats.push(['Traction', m.trac]);
  if(stats.length) h+=statsBar(stats);
  if(m.prefixes&&m.prefixes.length){
    h+=sec('Bitmap Prefixes', m.prefixes.length, m.prefixes.map(p=>`<span class="vc-flag" style="margin:2px">${H(p)}</span>`).join(''));
  }
  if(m.debris) h+=sec('Debris Bitmap', null, ft(m.debris,'tga'));
  // Reverse cross-refs
  const eUsers=E.filter(e=>e.mat===m.n);
  if(eUsers.length) h+=sec('Used by Entities', eUsers.length, eUsers.map(e=>`<div style="margin:3px 0"><a class="xref" ${nav('entities',e.n)}>${H(e.n)}</a></div>`).join(''));
  const cUsers=C.filter(c=>c.mat===m.n);
  if(cUsers.length) h+=sec('Used by Clutter', cUsers.length, cUsers.map(c=>`<div style="margin:3px 0"><a class="xref" ${nav('clutter',c.n)}>${H(c.n)}</a></div>`).join(''));
  return h;
}

function rMM(x){
  let h=`<div class="dt-sticky"><div class="dt">${H(x.n)}</div></div>`;
  const refs=[];
  if(x.mxref!==undefined) refs.push(['Move X', x.mxref]);
  if(x.myref!==undefined) refs.push(['Move Y', x.myref]);
  if(x.mzref!==undefined) refs.push(['Move Z', x.mzref]);
  if(x.rxref!==undefined) refs.push(['Rot X', x.rxref]);
  if(x.ryref!==undefined) refs.push(['Rot Y', x.ryref]);
  if(x.rzref!==undefined) refs.push(['Rot Z', x.rzref]);
  if(refs.length) h+=statsBar(refs);
  // Entities using this movemode
  const eUsers=E.filter(e=>e.mm===x.n);
  if(eUsers.length) h+=sec('Used by Entities', eUsers.length, eUsers.map(e=>`<div style="margin:3px 0"><a class="xref" ${nav('entities',e.n)}>${H(e.n)}</a></div>`).join(''));
  return h;
}

function rEm(em){
  let h=`<div class="dt-sticky"><div class="dt">${H(em.n)}</div></div>`;
  const stats=[];
  if(em.minlife!==undefined||em.maxlife!==undefined) stats.push(['Lifespan (s)', `${em.minlife??'?'} – ${em.maxlife??'?'}`]);
  if(em.minpr!==undefined||em.maxpr!==undefined) stats.push(['Radius', `${em.minpr??'?'} – ${em.maxpr??'?'}`]);
  if(em.minv!==undefined||em.maxv!==undefined) stats.push(['Velocity', `${em.minv??'?'} – ${em.maxv??'?'}`]);
  if(em.accel!==undefined) stats.push(['Accel', em.accel]);
  if(em.grav!==undefined) stats.push(['Gravity', em.grav]);
  if(em.growth!==undefined) stats.push(['Growth', em.growth]);
  if(em.dirrand!==undefined) stats.push(['Dir Rand', em.dirrand]);
  if(em.sdelay!==undefined) stats.push(['Spawn Delay', em.sdelay]);
  if(em.srad!==undefined) stats.push(['Spawn Radius', em.srad]);
  if(em.bounce!==undefined) stats.push(['Bounce', em.bounce]);
  if(em.stick!==undefined) stats.push(['Stick', em.stick]);
  if(em.on!==undefined) stats.push(['Initially On', em.on]);
  if(em.altst!==undefined) stats.push(['Alt States', em.altst]);
  if(stats.length) h+=statsBar(stats);
  if(em.bmp) h+=sec('Bitmap', null, ft(em.bmp,'tga'));
  let flags='';
  if(em.eflags) flags+=`<div class="mr"><span class="ml">Emitter Flags:</span><span class="vc-flag">${H(String(em.eflags))}</span></div>`;
  if(em.pflags) flags+=`<div class="mr"><span class="ml">Particle Flags:</span><span class="vc-flag">${H(String(em.pflags))}</span></div>`;
  if(em.pcolor!==undefined) flags+=`<div class="mr"><span class="ml">Particle Color:</span>${H(String(em.pcolor))}</div>`;
  if(em.pcolord!==undefined) flags+=`<div class="mr"><span class="ml">Color Dest:</span>${H(String(em.pcolord))}</div>`;
  if(flags) h+=sec('Flags & Color', null, flags);
  // Reverse: clutter that uses this emitter
  const cUsers=C.filter(c=>c.emit===em.n);
  if(cUsers.length) h+=sec('Used by Clutter', cUsers.length, cUsers.map(c=>`<div style="margin:3px 0"><a class="xref" ${nav('clutter',c.n)}>${H(c.n)}</a></div>`).join(''));
  // Explosions referencing this emitter
  const exUsers=EX.filter(x=>(x.cemits||[]).includes(em.n)||x.sparks===em.n||x.headtrail===em.n||x.tailtrail===em.n);
  if(exUsers.length) h+=sec('Used by Explosions', exUsers.length, exUsers.map(x=>`<div style="margin:3px 0"><a class="xref" ${nav('explosions',x.n)}>${H(x.n)}</a></div>`).join(''));
  return h;
}
